name: Android build

# Builds a real debug APK with Godot's Android export and verifies the artifact
# before uploading it.
#
# Signing: debug builds are signed with a *debug* keystore generated inside the
# job. Its password ("android") is the documented, publicly known Android debug
# password - it is not a secret and must never be reused for release signing.
# Release signing (upload keystore + Play credentials) is intentionally not
# configured yet; see BUILD.md.
#
# Toolchain versions below are pinned because the Android export depends on them
# all matching. `ANDROID_BUILD_TOOLS`/`ANDROID_PLATFORM` must match the API level
# of the official export template for this Godot version (see BUILD.md).

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"
  JDK_VERSION: "17"
  # Godot 4.7.2's Android export template targets API 36 (min API 24).
  ANDROID_PLATFORM: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  APK_PATH: build/android/last-haven.apk
  EXPORT_PRESET: Android

jobs:
  android:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JDK_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JDK_VERSION }}

      - name: Set up Android command line tools
        uses: android-actions/setup-android@v3

      - name: Install the exact Android SDK packages the export needs
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "::error::setup-android provided no SDK path (ANDROID_SDK_ROOT/ANDROID_HOME are unset)."
            exit 1
          fi
          # Pin the SDK root for every later step instead of relying on the action.
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(command -v sdkmanager || true)"
          [ -n "$SDKMANAGER" ] || SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"

          # `yes` is expected to die from SIGPIPE once sdkmanager exits, which
          # pipefail would report as a failure; the assertions below are the real check.
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

          # apksigner (build-tools) and adb (platform-tools) are what the export
          # actually shells out to.
          test -x "$SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
          test -x "$SDK_ROOT/platform-tools/adb"
          echo "android sdk ready: $SDK_ROOT (build-tools ${ANDROID_BUILD_TOOLS}, platform ${ANDROID_PLATFORM})"

      - name: Cache Godot and the Android export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-android-${{ env.GODOT_VERSION }}-bt${{ env.ANDROID_BUILD_TOOLS }}

      - name: Install Godot and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/godot"
          curl -sSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q -o /tmp/godot.zip -d "$HOME/godot"
          mv "$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/godot/godot"
          chmod +x "$HOME/godot/godot"

          # Only the Android templates are needed here; extracting just those
          # avoids unpacking ~1 GB of unrelated platform templates.
          curl -sSL -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -o /tmp/templates.tpz 'templates/android*' 'templates/version.txt' -d /tmp/templates
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/$(cat /tmp/templates/templates/version.txt)"
          mkdir -p "$TEMPLATE_DIR"
          mv /tmp/templates/templates/* "$TEMPLATE_DIR/"
          # Godot identifies an installed template set by this exact version string.
          test -f "$TEMPLATE_DIR/version.txt"
          test -f "$TEMPLATE_DIR/android_debug.apk"
          echo "Export templates installed in $TEMPLATE_DIR"

      - name: Configure Godot's Android export (SDK, JDK, debug keystore)
        run: |
          set -euo pipefail
          : "${ANDROID_SDK_ROOT:?ANDROID_SDK_ROOT is not set}"
          : "${JAVA_HOME:?JAVA_HOME is not set}"

          # The editor settings file is version specific: editor_settings-<major>.<minor>.tres
          GODOT_MINOR="$("$HOME/godot/godot" --headless --version | sed -E 's/^([0-9]+\.[0-9]+).*/\1/')"
          echo "Godot $("$HOME/godot/godot" --headless --version | head -1) -> editor_settings-${GODOT_MINOR}.tres"
          SETTINGS_DIR="$HOME/.config/godot"
          mkdir -p "$SETTINGS_DIR" "$HOME/.android"

          # keytool needs the parent directory to exist, and defaults to a PKCS12
          # keystore, which apksigner accepts.
          keytool -genkeypair -keyalg RSA -keysize 2048 -validity 9999 \
            -alias androiddebugkey -keypass android \
            -keystore "$HOME/.android/debug.keystore" -storepass android -storetype PKCS12 \
            -dname "CN=Android Debug,O=Android,C=US"
          test -s "$HOME/.android/debug.keystore"

          # export/android/java_sdk_path is required: the export runs apksigner (a
          # Java tool), and Godot refuses to export Android without it.
          {
            printf '[gd_resource type="EditorSettings" format=3]\n\n'
            printf '[resource]\n'
            printf 'export/android/android_sdk_path = "%s"\n' "$ANDROID_SDK_ROOT"
            printf 'export/android/java_sdk_path = "%s"\n' "$JAVA_HOME"
            printf 'export/android/debug_keystore = "%s"\n' "$HOME/.android/debug.keystore"
            printf 'export/android/debug_keystore_user = "androiddebugkey"\n'
            printf 'export/android/debug_keystore_pass = "android"\n'
          } > "$SETTINGS_DIR/editor_settings-${GODOT_MINOR}.tres"
          cat "$SETTINGS_DIR/editor_settings-${GODOT_MINOR}.tres"

      - name: Import project
        run: ~/godot/godot --headless --path . --import

      - name: Export debug APK
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$APK_PATH")"
          set -o pipefail
          ~/godot/godot --headless --path . --export-debug "$EXPORT_PRESET" "$APK_PATH" 2>&1 | tee "$(dirname "$APK_PATH")/export.log"
          if grep -qE "The resulting APK is unsigned|Could not find version of build tools that matches Target SDK|Project export for preset .* failed" "$(dirname "$APK_PATH")/export.log"; then
            echo "::error::Godot reported an Android export problem - see the log above."
            exit 1
          fi
          test -f "$APK_PATH"

      - name: Validate the APK
        run: |
          set -euo pipefail
          : "${ANDROID_SDK_ROOT:?ANDROID_SDK_ROOT is not set}"
          APKANALYZER="$(command -v apkanalyzer || true)"
          [ -n "$APKANALYZER" ] || APKANALYZER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/apkanalyzer"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
          REPORT="$(dirname "$APK_PATH")/apk-validation.txt"
          test -x "$APKANALYZER"
          test -x "$APKSIGNER"

          {
            echo "apk: $(realpath "$APK_PATH")"
            echo "bytes: $(stat -c%s "$APK_PATH")"
            echo "sha256: $(sha256sum "$APK_PATH" | cut -d' ' -f1)"
          } | tee "$REPORT"

          # A truncated download or a stub file must never be uploaded as an APK.
          SIZE="$(stat -c%s "$APK_PATH")"
          if [ "$SIZE" -lt 10000000 ]; then
            echo "::error::APK is only ${SIZE} bytes - the export did not produce a usable artifact."
            exit 1
          fi

          # Cross-check the artifact against the export preset instead of a hardcoded id.
          EXPECTED_APP_ID="$(grep -oP 'package/unique_name="\K[^"]+' export_presets.cfg | head -1)"
          test -n "$EXPECTED_APP_ID"
          APP_ID="$("$APKANALYZER" manifest application-id "$APK_PATH")"
          echo "application-id: $APP_ID (expected $EXPECTED_APP_ID)" | tee -a "$REPORT"
          if [ "$APP_ID" != "$EXPECTED_APP_ID" ]; then
            echo "::error::APK application id '$APP_ID' does not match the export preset '$EXPECTED_APP_ID'."
            exit 1
          fi

          {
            echo "version-name: $("$APKANALYZER" manifest version-name "$APK_PATH")"
            echo "version-code: $("$APKANALYZER" manifest version-code "$APK_PATH")"
            echo "min-sdk: $("$APKANALYZER" manifest min-sdk "$APK_PATH")"
            echo "target-sdk: $("$APKANALYZER" manifest target-sdk "$APK_PATH")"
          } | tee -a "$REPORT"

          # The engine binary and the packed game data must both be inside.
          FILES="$("$APKANALYZER" files list "$APK_PATH")"
          echo "$FILES" | grep -q "lib/arm64-v8a/libgodot_android.so" \
            || { echo "::error::The APK does not contain libgodot_android.so for arm64-v8a."; exit 1; }
          echo "$FILES" | grep -q "assets/assets.sparsepck" \
            || { echo "::error::The APK does not contain the packed game data (assets/assets.sparsepck)."; exit 1; }
          echo "native libraries + packed game data: OK" | tee -a "$REPORT"

          # apksigner exits non-zero if the signature does not verify.
          "$APKSIGNER" verify --verbose "$APK_PATH" 2>&1 | tee -a "$REPORT"
          echo "signature: verified" | tee -a "$REPORT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: last-haven-debug-apk
          path: |
            ${{ env.APK_PATH }}
            build/android/apk-validation.txt
            build/android/export.log
          if-no-files-found: error
